substitutions:
  name: lora-lilygo-t3-wmbus-ble
  friendly_name: "LoRA LILYGO T3 wM-Bus BLE"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.2

esp32:
  board: esp32dev
  variant: ESP32
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/kzajac83/esphome-wmbus-bridge-rawonly.git
      ref: codex/wmbus-t2
    components: [wmbus_radio]
    refresh: 0s

logger:
  level: INFO
  logs:
    mqtt: WARN
    esp32_ble_tracker: WARN

wifi:
  id: wifi_link
  ssid: !secret wifi_ssid_ha
  password: !secret wifi_password_ha
  power_save_mode: none

api:
  encryption:
    key: !secret t3_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret t3_ota_password

mqtt:
  id: mqtt_link
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: false
  log_topic: null
  reboot_timeout: 0s

time:
  - platform: sntp
    id: network_time
    timezone: Europe/Warsaw
    servers:
      - pl.pool.ntp.org
      - 0.pool.ntp.org

# BLE do Home Assistanta. Domyślne parametry skanowania.
esp32_ble_tracker:

bluetooth_proxy:
  active: true
  # Limit jednoczesnych połączeń GATT.
  connection_slots: 2

# Wbudowany SX1276.
spi:
  id: radio_spi
  clk_pin: GPIO5
  mosi_pin: GPIO27
  miso_pin: GPIO19

globals:
  - id: rx_frames
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_rssi
    type: int
    restore_value: false
    initial_value: '-127'
  - id: last_frame_address
    type: uint32_t
    restore_value: false
    initial_value: '0'

wmbus_radio:
  id: wmbus_receiver
  spi_id: radio_spi
  radio_type: SX1276
  cs_pin: GPIO18
  reset_pin: GPIO23
  irq_pin: GPIO33  # DIO1 radia, FSK FIFO level.

  topic_name: lilygo-t3
  # S1 wybiera 868,300 MHz i Manchester, wspólne z T2 czytnik -> licznik.
  listen_mode: s1
  min_preamble_bits: 16
  publish_radio_raw: true
  radio_raw_topic: wmbus/lilygo-t2-capture/raw
  log_language: pl
  diagnostic_mode: normal
  diagnostic_summary_interval: 60s
  publish_rssi: true
  telegram_qos: 1
  # Oszczędzamy RAM dla BLE.
  mqtt_buffer_size: 0

  on_frame:
    - mark_as_handled: false
      then:
        - lambda: |-
            id(rx_frames)++;
            id(last_rssi) = frame->rssi();
            uint32_t address = 0;
            frame->try_get_meter_id_raw(address);
            id(last_frame_address) = address;

# Diagnostyka stabilności połączenia wM-Bus + BLE.
debug:
  update_interval: 30s

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
  - platform: debug
    free:
      id: free_heap
      name: "Free heap"
  - platform: template
    name: "wM-Bus received frames"
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 30s
    lambda: return id(rx_frames);
  - platform: template
    name: "wM-Bus raw captures"
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 30s
    lambda: return id(wmbus_receiver).get_raw_capture_stats().count;

# Wbudowany OLED SSD1306 128x64.
i2c:
  id: oled_i2c
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: oled_font
    size: 12
    bpp: 1

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    i2c_id: oled_i2c
    update_interval: 1s
    lambda: |-
      const auto &capture = id(wmbus_receiver).get_raw_capture_stats();
      const bool s_mode = id(wmbus_receiver).get_active_listen_mode() == esphome::wmbus_radio::LISTEN_MODE_S1;
      it.print(0, 0, id(oled_font), s_mode ? "868.300 MHz" : "868.950 MHz");
      it.print(127, 0, id(oled_font), TextAlign::TOP_RIGHT, id(mqtt_link).is_connected() ? "MQTT" : "OFF");
      it.printf(0, 13, id(oled_font), "RAW %lu", (unsigned long) capture.count);
      it.printf(0, 26, id(oled_font), "CRC OK %lu", (unsigned long) id(rx_frames));
      if (capture.last_rssi_dbm >= -125 && capture.last_rssi_dbm < 0) {
        it.printf(0, 39, id(oled_font), "RSSI %d dBm", (int) capture.last_rssi_dbm);
      } else {
        it.print(0, 39, id(oled_font), "RSSI --");
      }
      if (capture.count != 0) {
        it.printf(127, 39, id(oled_font), TextAlign::TOP_RIGHT, "%u B", (unsigned) capture.last_size);
      }
      if (id(last_frame_address) != 0) {
        it.printf(0, 51, id(oled_font), "ADR %08lX", (unsigned long) id(last_frame_address));
      } else {
        it.print(0, 51, id(oled_font), "ADR --");
      }
