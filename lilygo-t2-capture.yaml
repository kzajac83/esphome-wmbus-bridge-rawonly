esphome:
  name: lilygo-t2-capture
  min_version: 2026.1.3

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/kzajac83/esphome-wmbus-bridge-rawonly.git
      ref: codex/wmbus-t2
    components: [wmbus_radio]
    refresh: 0s

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: false
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret wmbus_t2_ota_password

spi:
  clk_pin: GPIO5
  mosi_pin: GPIO27
  miso_pin: GPIO19

wmbus_radio:
  radio_type: SX1276
  cs_pin: GPIO18
  reset_pin: GPIO23
  irq_pin: GPIO33  # SX1276 DIO1 (FSK FIFO level)
  listen_mode: s1  # 32.768 kchip/s, Manchester, shared with T2 reader -> meter
  frequency: 868.300  # MHz
  min_preamble_bits: 16
  topic_name: lilygo-t2-capture
  publish_radio_raw: true
  radio_raw_topic: wmbus/lilygo-t2-capture/raw
